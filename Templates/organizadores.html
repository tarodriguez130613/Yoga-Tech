<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga-Tech · Organizadores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f7f4; color: #1b4332; padding: 20px 16px 40px; }
    .wrap { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .sub { color: #2d6a4f; margin-bottom: 18px; font-size: 0.95rem; }
    .card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(27,67,50,0.08); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e9ecef; }
    th { color: #2d6a4f; background: #f8faf9; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat { flex: 1; min-width: 120px; background: #f8faf9; border-radius: 12px; padding: 14px; text-align: center; border-left: 4px solid #2d6a4f; }
    .stat .n { font-size: 1.6rem; font-weight: 800; }
    .stat .l { font-size: 0.8rem; color: #52796f; margin-top: 2px; }
    .btn { border: none; border-radius: 50px; padding: 11px 18px; font-weight: 700; cursor: pointer; font-size: 0.9rem; margin-right: 8px; margin-top: 6px; }
    .btn-g { background: #2d6a4f; color: white; }
    .btn-r { background: #c1121f; color: white; }
    .btn-b { background: #e9d8c4; color: #1b4332; }
    .pin-box { max-width: 300px; margin: 50px auto; text-align: center; }
    .pin-box input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #cce3de; font-size: 1.1rem; text-align: center; margin: 12px 0; }
    .hidden { display: none; }
    .empty { text-align: center; color: #6c757d; padding: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="pinScreen" class="pin-box card">
      <h2>Acceso organizadores</h2>
      <input type="password" id="pin" placeholder="PIN" maxlength="6">
      <button class="btn btn-g" style="width:100%" onclick="entrar()">Entrar</button>
      <br><a href="/" style="display:inline-block;margin-top:14px;color:#2d6a4f;font-size:0.9rem;">← Volver</a>
    </div>

    <div id="panel" class="hidden">
      <h1>Yoga-Tech</h1>
      <p class="sub">Panel de organizadores</p>

      <button class="btn btn-g" onclick="cargar()">Actualizar</button>
      <button class="btn btn-r" onclick="limpiar()">Limpiar todo</button>
      <a href="/"><button class="btn btn-b">Volver</button></a>

      <div class="card" style="margin-top:16px">
        <h2>Resumen</h2>
        <div class="stats" id="stats">
          <div class="stat"><div class="n" id="sMax">—</div><div class="l">Mayor puntuación</div></div>
          <div class="stat"><div class="n" id="sMin">—</div><div class="l">Menor puntuación</div></div>
          <div class="stat"><div class="n" id="sAvg">—</div><div class="l">Promedio</div></div>
          <div class="stat"><div class="n" id="sPart">—</div><div class="l">Participantes</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Todos los participantes</h2>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Nivel</th><th>Hora</th></tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="5" class="empty">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PIN = "0326";

    function entrar() {
      if (document.getElementById('pin').value === PIN) {
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        cargar();
        setInterval(cargar, 7000);
      } else {
        alert('PIN incorrecto');
      }
    }

    function cargar() {
      fetch('/api/resultados')
        .then(r => r.json())
        .then(d => {
          document.getElementById('sMax').textContent = d.stats.max ?? '—';
          document.getElementById('sMin').textContent = d.stats.min ?? '—';
          document.getElementById('sAvg').textContent = d.stats.promedio ?? '—';
          document.getElementById('sPart').textContent = d.stats.participantes ?? 0;

          const tb = document.getElementById('tbody');
          if (!d.resultados.length) {
            tb.innerHTML = '<tr><td colspan="5" class="empty">Aún no hay resultados</td></tr>';
            return;
          }
          tb.innerHTML = d.resultados.slice().reverse().map(r =>
            `<tr>
              <td>${r.id}</td>
              <td><strong>${r.nombre}</strong></td>
              <td><strong>${r.puntuacion}</strong></td>
              <td>${r.nivel}</td>
              <td>${r.hora}</td>
            </tr>`
          ).join('');
        })
        .catch(() => {
          document.getElementById('tbody').innerHTML =
            '<tr><td colspan="5" class="empty">Error de conexión. ¿El servidor está corriendo?</td></tr>';
        });
    }

    function limpiar() {
      if (!confirm('¿Borrar todos los resultados?')) return;
      fetch('/api/limpiar', {method:'POST'}).then(() => cargar());
    }
  </script>
</body>
</html>
