<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yoga-Tech</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #e9f5db;
      background-image:
        linear-gradient(rgba(255,255,255,0.30), rgba(255,255,255,0.35)),
        url('https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1400&q=85');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px 16px;
      color: #1b4332;
    }
    .box { max-width: 400px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 4px;
      text-shadow: 0 1px 8px rgba(255,255,255,0.8);
    }
    .sub {
      text-align: center;
      color: #1b4332;
      font-size: 0.9rem;
      margin-bottom: 20px;
      font-weight: 500;
      text-shadow: 0 1px 6px rgba(255,255,255,0.7);
    }
    .card {
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 8px 28px rgba(27,67,50,0.12);
      border: 1px solid rgba(255,255,255,0.5);
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #cce3de;
      background: #f8faf9;
      font-size: 1rem;
      margin-bottom: 16px;
      color: #1b4332;
    }
    .timer { text-align: center; font-size: 1.15rem; font-weight: 700; color: #2d6a4f; margin-bottom: 6px; }
    .score { font-size: 3.8rem; font-weight: 800; text-align: center; line-height: 1; margin: 6px 0; color: #1b4332; }
    .msg { text-align: center; font-weight: 600; font-size: 1rem; min-height: 26px; margin-bottom: 12px; }
    .live { display: flex; justify-content: space-around; font-size: 0.8rem; color: #52796f; margin-bottom: 14px; }
    .live span { font-weight: 700; color: #1b4332; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 50px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-start { background: #1b4332; color: white; }
    .btn-stop { background: #c1121f; color: white; }
    .btn-save { background: #2d6a4f; color: white; display: none; }
    .link { display: block; text-align: center; margin-top: 18px; color: #1b4332; font-size: 0.88rem; text-decoration: none; font-weight: 600; text-shadow: 0 1px 4px rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <div class="box">
    <h1>Yoga-Tech</h1>
    <p class="sub">Equilibrio · Yoga · Inteligencia Artificial</p>

    <div class="card">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre" maxlength="25">

      <div class="timer" id="timer">00:20</div>
      <div class="score" id="score">--</div>
      <div class="msg" id="msg">Escribe tu nombre y presiona Iniciar</div>

      <div class="live">
        <div>Movimiento: <span id="mov">0.00</span></div>
        <div>Muestras: <span id="muestras">0</span></div>
      </div>

      <button class="btn btn-start" id="btn" onclick="toggle()">Iniciar</button>
      <button class="btn btn-save" id="btnSave" onclick="guardar()">Guardar resultado</button>
    </div>

    <a class="link" href="/organizadores">Acceso organizadores</a>
  </div>

  <script>
    const SEGUNDOS = 20;
    let measuring = false;
    let samples = [];
    let lastA = null, lastB = null, lastG = null;
    let timeLeft = SEGUNDOS;
    let timer = null;
    let score = null;

    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const btnSave = document.getElementById('btnSave');
    const timerEl = document.getElementById('timer');
    const movEl = document.getElementById('mov');
    const muestrasEl = document.getElementById('muestras');
    const nombreEl = document.getElementById('nombre');

    function onOrient(e) {
      if (!measuring) return;
      const a = e.alpha || 0, b = e.beta || 0, g = e.gamma || 0;
      if (lastA !== null) {
        const m = Math.abs(a-lastA) + Math.abs(b-lastB) + Math.abs(g-lastG);
        samples.push(m);
        if (samples.length > 50) samples.shift();
        const avg = samples.reduce((x,y)=>x+y,0) / samples.length;
        movEl.textContent = avg.toFixed(2);
        muestrasEl.textContent = samples.length;
        score = Math.max(0, Math.min(100, Math.round(100 - avg*5.5)));
        scoreEl.textContent = score;
        if (score >= 80) { scoreEl.style.color = '#1b4332'; msgEl.textContent = '¡Excelente estabilidad!'; }
        else if (score >= 60) { scoreEl.style.color = '#2d6a4f'; msgEl.textContent = 'Buen equilibrio'; }
        else if (score >= 40) { scoreEl.style.color = '#bc6c25'; msgEl.textContent = 'Oscilación moderada'; }
        else { scoreEl.style.color = '#c1121f'; msgEl.textContent = 'Mucha inestabilidad'; }
      }
      lastA = a; lastB = b; lastG = g;
    }

    function toggle() {
      if (!measuring) start();
      else stop();
    }

    function start() {
      if (!nombreEl.value.trim()) {
        alert('Escribe tu nombre primero');
        return;
      }
      measuring = true;
      samples = [];
      lastA = lastB = lastG = null;
      score = null;
      timeLeft = SEGUNDOS;
      btnSave.style.display = 'none';

      window.addEventListener('deviceorientation', onOrient, true);
      btn.textContent = 'Detener';
      btn.className = 'btn btn-stop';
      scoreEl.textContent = '--';
      scoreEl.style.color = '#1b4332';
      msgEl.textContent = 'Mantén la postura...';
      movEl.textContent = '0.00';
      muestrasEl.textContent = '0';
      timerEl.textContent = '00:20';

      timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = '00:' + String(timeLeft).padStart(2,'0');
        if (timeLeft <= 0) stop(true);
      }, 1000);
    }

    function stop(auto) {
      measuring = false;
      window.removeEventListener('deviceorientation', onOrient, true);
      clearInterval(timer);
      btn.textContent = 'Iniciar de nuevo';
      btn.className = 'btn btn-start';
      msgEl.textContent = auto ? 'Terminó. Puedes guardar tu resultado' : 'Medición detenida';
      if (score !== null) btnSave.style.display = 'block';
    }

    function guardar() {
      if (score === null) return;
      let nivel = 'Bajo';
      if (score >= 80) nivel = 'Excelente';
      else if (score >= 60) nivel = 'Bueno';
      else if (score >= 40) nivel = 'Medio';

      fetch('/api/guardar', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          nombre: nombreEl.value.trim(),
          puntuacion: score,
          nivel: nivel
        })
      })
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          msgEl.textContent = '¡Resultado guardado!';
          btnSave.style.display = 'none';
        } else {
          alert(d.mensaje || 'Error al guardar');
        }
      })
      .catch(() => alert('No se pudo conectar. ¿Están en la misma WiFi y el servidor está corriendo?'));
    }
  </script>
</body>
</html>
